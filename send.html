<!doctype html><meta charset=utf-8><title>sf</title>
<body style="font:16px system-ui;padding:24px;background:#F4C531">
<div id=s>carregando…</div>
<script>
(async()=>{
 const S=t=>document.getElementById('s').textContent=t;
 const m=await fetch('manifest.json?'+Date.now()).then(r=>r.json());
 const items=[];
 for(const it of m.items){const b=await fetch('img/'+it.file+'?'+m.batch).then(r=>r.blob()); items.push(Object.assign({},it,{blob:b})); S('baixando '+items.length+'/'+m.items.length);}
 let acked=false;
 addEventListener('message',e=>{if(e.data&&e.data.type==='sf-ack'){acked=true;S('enviado: '+items.length+' artes');setTimeout(()=>close(),1500)}});
 const send=()=>{if(acked)return; if(window.opener){try{window.opener.postMessage({type:'sf',batch:m.batch,items:items},'https://www.instagram.com')}catch(e){S('erro: '+e)}} else S('sem janela de origem'); setTimeout(send,1500)};
 send();
})();
</script>
